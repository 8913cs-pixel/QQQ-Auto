<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triple Calendar Lab — QQQ Options Backtester</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  * { box-sizing: border-box; margin:0; padding:0; }
  body { background:#14171A; color:#E9E6DE; font-family:'Inter',system-ui,sans-serif; display:flex; min-height:100vh; }
  .mono { font-family:'IBM Plex Mono',monospace; }
  .display { font-family:'Space Grotesk',sans-serif; }
  a { color:inherit; }

  #sidebar { width:220px; border-right:1px solid #2A2F35; padding:20px 14px; display:flex; flex-direction:column; gap:4px; flex-shrink:0; }
  .brand { padding:4px 10px 20px; }
  .brand .eyebrow { font-size:10px; letter-spacing:1.5px; color:#C9A227; font-weight:600; }
  .brand .title { font-size:19px; font-weight:700; margin-top:2px; }
  .navbtn { display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:8px; cursor:pointer; color:#8B9099; font-size:13.5px; font-weight:500; border:1px solid transparent; transition:all .15s; user-select:none; }
  .navbtn:hover { color:#E9E6DE; background:#1D2126; }
  .navbtn.active { color:#E9E6DE; background:#1D2126; border-color:#2A2F35; }
  .sidebar-foot { margin-top:auto; padding:14px 10px 4px; border-top:1px solid #2A2F35; }
  .sidebar-foot .label { font-size:10.5px; color:#8B9099; letter-spacing:.5px; }
  .sidebar-foot .num { font-size:26px; font-weight:700; }
  .sidebar-foot .sub { font-size:11.5px; color:#8B9099; margin-top:2px; }

  #main { flex:1; padding:28px 36px; max-width:980px; overflow:auto; }
  .eyebrow { font-size:10.5px; letter-spacing:1.5px; color:#C9A227; font-weight:600; margin-bottom:6px; }
  .h1 { font-size:24px; font-weight:700; margin-bottom:6px; }
  .desc { font-size:13.5px; color:#8B9099; max-width:600px; line-height:1.6; margin-bottom:24px; }
  .section-label { font-size:10.5px; letter-spacing:1.5px; color:#8B9099; font-weight:600; margin:20px 0 10px; }

  .card { background:#1A1D21; border:1px solid #2A2F35; border-radius:10px; }
  textarea { width:100%; height:130px; resize:vertical; background:#14171A; border:1px solid #2A2F35; color:#E9E6DE; border-radius:6px; padding:10px; font-family:'IBM Plex Mono',monospace; font-size:13px; }
  input[type=number] { background:#14171A; border:1px solid #2A2F35; color:#E9E6DE; border-radius:6px; padding:8px 10px; font-family:'IBM Plex Mono',monospace; font-size:13px; width:90px; text-align:right; }
  input[type=date] { background:#14171A; border:1px solid #2A2F35; color:#E9E6DE; border-radius:6px; padding:8px 10px; font-family:'IBM Plex Mono',monospace; font-size:13px; }
  select { background:#14171A; border:1px solid #2A2F35; color:#E9E6DE; border-radius:6px; padding:8px 10px; font-family:'IBM Plex Mono',monospace; font-size:13px; }
  textarea:focus, input:focus, select:focus { outline:none; border-color:#C9A227; }
  button.primary { background:#C9A227; color:#14171A; font-weight:600; border:none; border-radius:7px; padding:9px 16px; cursor:pointer; font-size:13.5px; }
  button.primary:hover { background:#DCB53A; }
  button.primary:disabled { opacity:.4; cursor:not-allowed; }
  button.ghost, label.ghost { background:transparent; border:1px solid #2A2F35; color:#8B9099; border-radius:7px; padding:9px 14px; cursor:pointer; font-size:12.5px; display:inline-block; }
  button.ghost:hover, label.ghost:hover { border-color:#4C7A8A; color:#E9E6DE; }
  button.small { padding:6px 10px; font-size:11.5px; }
  .msg-error { display:flex; align-items:center; gap:6px; color:#D08E8E; font-size:12.5px; }
  .msg-success { display:flex; align-items:center; gap:6px; color:#9FBF8F; font-size:12.5px; }
  .empty { padding:24px; text-align:center; color:#8B9099; font-size:13.5px; }

  .snap-row { display:flex; align-items:center; padding:12px 16px; border-top:1px solid #2A2F35; }
  .snap-row:first-child { border-top:none; }
  .snap-date { width:160px; font-size:13px; font-weight:600; }
  .snap-spot { width:100px; font-size:12.5px; color:#8B9099; }
  .snap-meta { flex:1; font-size:12px; color:#8B9099; }

  .cfg-row { display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid #2A2F35; }
  .cfg-row:last-child { border-bottom:none; }
  .cfg-label { font-size:13.5px; font-weight:500; }
  .cfg-hint { font-size:11.5px; color:#8B9099; margin-top:2px; }

  .leg-row { display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid #2A2F35; }
  .leg-row:last-child { border-bottom:none; }
  .leg-tagchip { width:42px; font-size:10.5px; font-weight:700; letter-spacing:.5px; text-align:center; padding:5px 0; border-radius:5px; }
  .leg-field-label { font-size:10px; color:#8B9099; margin-bottom:3px; letter-spacing:.5px; }

  .stat-row { display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .stat { padding:13px 16px; flex:1; min-width:120px; }
  .stat-label { font-size:10px; letter-spacing:1px; color:#8B9099; margin-bottom:6px; }
  .stat-value { font-size:18px; font-weight:600; }

  .leg-detail-row { display:flex; align-items:center; padding:11px 16px; border-top:1px solid #2A2F35; font-size:12.5px; }
  .leg-detail-row:first-child { border-top:none; }

  .upload-card { padding:18px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .backup-row { display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; }

  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:#2A2F35; border-radius:4px; }
</style>
</head>
<body>
<div id="sidebar">
  <div class="brand">
    <div class="eyebrow">QQQ · OPTIONS</div>
    <div class="display title">Triple Calendar Lab</div>
    <a href="calendar-generator.html" style="display:block;margin-top:8px;font-size:11.5px;color:#4C7A8A;text-decoration:none;">&rarr; Open Generator page</a>
  </div>
  <div class="navbtn active" data-tab="data">Data</div>
  <div class="navbtn" data-tab="strategy">Strategy</div>
  <div class="navbtn" data-tab="backtest">Backtest</div>
  <div class="sidebar-foot">
    <div class="label mono">SNAPSHOTS STORED</div>
    <div class="num display mono" id="snapCount">0</div>
    <div class="sub mono" id="lastSpot"></div>
  </div>
</div>
<div id="main"></div>

<script>
/* ---------- Black-Scholes fallback pricer ---------- */
function erf(x){var sign=x<0?-1:1;x=Math.abs(x);var a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;var t=1/(1+p*x);var y=1-((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);return sign*y;}
function normCdf(x){return 0.5*(1+erf(x/Math.sqrt(2)));}
function bsPrice(S,K,T,iv,type){if(T<=0)return type==='call'?Math.max(S-K,0):Math.max(K-S,0);if(iv<=0)iv=0.15;var r=0.045;var d1=(Math.log(S/K)+(r+iv*iv/2)*T)/(iv*Math.sqrt(T));var d2=d1-iv*Math.sqrt(T);if(type==='call')return S*normCdf(d1)-K*Math.exp(-r*T)*normCdf(d2);return K*Math.exp(-r*T)*normCdf(-d2)-S*normCdf(-d1);}
function daysBetween(a,b){return (new Date(b)-new Date(a))/86400000;}
function fmtMoney(n){return (n<0?'-$':'$')+Math.abs(n).toFixed(2);}
function formatDateLabel(d){
  // d is either "YYYY-MM-DD" or "YYYY-MM-DDTHH:MM"
  if (d.length > 10) return d.slice(5,10)+' '+d.slice(11,16);
  return d.slice(5);
}
function weekdayOf(dateStr){
  // Parse Y-M-D as local calendar date (avoids UTC-offset day-shift bugs from `new Date("YYYY-MM-DD")`)
  var p = dateStr.slice(0,10).split('-');
  return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10)).getDay();
}
var WEEKDAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function findQuoteInChain(chain, strike, expiration, type){
  for (var i=0;i<chain.length;i++){ var c=chain[i]; if (Math.abs(c.strike-strike)<0.01 && c.expiration===expiration && c.type===type) return c; }
  return null;
}
function midOfQuote(q){ if(!q) return null; if(q.bid>0 && q.ask>0) return (q.bid+q.ask)/2; if(q.last>0) return q.last; return null; }
function pickExpirationFor(expirations, refDate, targetDTE){
  var best=null, bestDiff=Infinity;
  expirations.forEach(function(e){
    var dte = daysBetween(refDate, e);
    if (dte < 0) return;
    var diff = Math.abs(dte - targetDTE);
    if (diff < bestDiff){ bestDiff = diff; best = e; }
  });
  return best;
}
function pickATMStrikeDownside(strikesAvail, spot, grid){
  // ATM leg = nearest strike at/below a grid-rounded spot (e.g. grid=5: 694->690, 698->695, 703->700).
  // Rounds the TARGET down to the grid first, then finds the closest tradable strike at/below that target,
  // so the result lands on a clean number instead of whatever raw strike happens to exist near spot.
  grid = grid || 5;
  var target = Math.floor(spot / grid) * grid;
  var below = strikesAvail.filter(function(s){ return s <= target; });
  if (below.length) return Math.max.apply(null, below);
  var belowSpot = strikesAvail.filter(function(s){ return s <= spot; });
  if (belowSpot.length) return Math.max.apply(null, belowSpot);
  return Math.min.apply(null, strikesAvail);
}
function roundUpToGrid(value, grid){
  grid = grid || 5;
  return Math.ceil(value / grid) * grid;
}
function detectLocalStrikeGrid(strikesAvail, spot){
  // Uses the standard strike-interval convention traders actually round to, based on the
  // underlying's price level -- NOT the literal gap between listed strikes. Exchanges fill in
  // $1-wide strikes near the money for liquidity even on names that "round" to $5 in practice
  // (QQQ, SPY, etc.), so detecting the raw listing gap picks up $1 and gives the wrong answer.
  if (spot < 25) return 0.5;
  if (spot < 200) return 1;
  if (spot < 2000) return 5;
  return 25;
}

function entryCandidates(){
  var snapshots = state.snapshots.slice();
  if (state.config.startDate) snapshots = snapshots.filter(function(s){ return s.date.slice(0,10) >= state.config.startDate; });
  if (state.config.endDate) snapshots = snapshots.filter(function(s){ return s.date.slice(0,10) <= state.config.endDate; });
  if (state.config.entryWeekday !== '' && state.config.entryWeekday != null){
    var wd = parseInt(state.config.entryWeekday,10);
    snapshots = snapshots.filter(function(s){ return weekdayOf(s.date) === wd; });
  }
  return snapshots;
}

function pickEntrySnapshotMeta(candidates){
  // candidates is chronologically sorted. Group by calendar day, take the earliest qualifying
  // day, then use that day's FIRST or LAST snapshot depending on config.entryTimeOfDay.
  if (!candidates.length) return null;
  var firstDay = candidates[0].date.slice(0,10);
  var sameDay = candidates.filter(function(s){ return s.date.slice(0,10) === firstDay; });
  return (state.config.entryTimeOfDay === 'last') ? sameDay[sameDay.length-1] : sameDay[0];
}

function computeAutoStrikes(){
  var msgEl = document.getElementById('autoStrikeMsg');
  var candidates = entryCandidates();
  if (!candidates.length){ if(msgEl) msgEl.innerHTML = '<div class="msg-error">No snapshot matches your date range / entry weekday. Adjust those first.</div>'; return; }
  var entryMeta = pickEntrySnapshotMeta(candidates);
  var entrySnap = state.snapshotCache[entryMeta.date];
  var frontExp = pickExpirationFor(entryMeta.expirations, entrySnap.date, state.config.entryDTEFront);
  if (!frontExp){ if(msgEl) msgEl.innerHTML = '<div class="msg-error">Could not find a front expiration near your target DTE in that snapshot.</div>'; return; }

  var strikesAvail = Array.from(new Set(entrySnap.chain.filter(function(c){return c.expiration===frontExp;}).map(function(c){return c.strike;})));
  if (!strikesAvail.length){ if(msgEl) msgEl.innerHTML = '<div class="msg-error">No strikes found for '+frontExp+' in that snapshot.</div>'; return; }
  var grid = detectLocalStrikeGrid(strikesAvail, entrySnap.spot);
  var atmStrike = pickATMStrikeDownside(strikesAvail, entrySnap.spot, grid);

  var atmCallQ = findQuoteInChain(entrySnap.chain, atmStrike, frontExp, 'call');
  var atmPutQ = findQuoteInChain(entrySnap.chain, atmStrike, frontExp, 'put');
  var atmCallMid = midOfQuote(atmCallQ), atmPutMid = midOfQuote(atmPutQ);
  if (atmCallMid == null || atmPutMid == null){ if(msgEl) msgEl.innerHTML = '<div class="msg-error">ATM call/put quote missing at strike '+atmStrike+' for '+frontExp+' in that snapshot.</div>'; return; }

  var straddle = atmCallMid + atmPutMid;
  var cushion = (state.config.cushion != null && !isNaN(state.config.cushion)) ? state.config.cushion : 5;
  var offset = roundUpToGrid(straddle + cushion, grid);
  var callStrike = atmStrike + offset;
  var putStrike = atmStrike - offset;

  function nearestAvailable(target){
    var best = strikesAvail[0], bestDiff = Math.abs(strikesAvail[0]-target);
    strikesAvail.forEach(function(s){ var d = Math.abs(s-target); if (d < bestDiff){ bestDiff = d; best = s; } });
    return best;
  }
  callStrike = nearestAvailable(callStrike);
  putStrike = nearestAvailable(putStrike);

  var oldLegs = state.config.legs;
  var qtyFor = function(i, fallback){ return (oldLegs && oldLegs[i] && oldLegs[i].qty) ? oldLegs[i].qty : fallback; };
  state.config.legs = [
    { id:'leg'+(legIdCounter++), type:'put', strike:atmStrike, qty:qtyFor(0,1), premium:null },
    { id:'leg'+(legIdCounter++), type:'call', strike:callStrike, qty:qtyFor(1,1), premium:null },
    { id:'leg'+(legIdCounter++), type:'put', strike:putStrike, qty:qtyFor(2,1), premium:null }
  ];
  saveConfigRaw(state.config);
  render();
  var m = document.getElementById('autoStrikeMsg');
  if (m) m.innerHTML = '<div class="msg-success">Computed from '+entryMeta.date+': ATM '+atmStrike+' (straddle $'+straddle.toFixed(2)+' + $'+cushion.toFixed(2)+' cushion = &plusmn;'+offset.toFixed(2)+') &rarr; put '+atmStrike+', call '+callStrike+', put '+putStrike+'.</div>';
}

/* ---------- Storage: IndexedDB (much higher capacity than localStorage) ---------- */
var DB_NAME = 'tcl-db', STORE_NAME = 'kv', dbPromise = null;
function openDB(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise(function(resolve, reject){
    var req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = function(e){
      var db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
    };
    req.onsuccess = function(e){ resolve(e.target.result); };
    req.onerror = function(e){ reject(e.target.error); };
  });
  return dbPromise;
}
function idbGet(key){ return openDB().then(function(db){ return new Promise(function(resolve,reject){ var tx=db.transaction(STORE_NAME,'readonly'); var req=tx.objectStore(STORE_NAME).get(key); req.onsuccess=function(){resolve(req.result);}; req.onerror=function(){reject(req.error);}; }); }); }
function idbSet(key, value){ return openDB().then(function(db){ return new Promise(function(resolve,reject){ var tx=db.transaction(STORE_NAME,'readwrite'); tx.objectStore(STORE_NAME).put(value, key); tx.oncomplete=function(){resolve(true);}; tx.onerror=function(){reject(tx.error);}; }); }); }
function idbDelete(key){ return openDB().then(function(db){ return new Promise(function(resolve,reject){ var tx=db.transaction(STORE_NAME,'readwrite'); tx.objectStore(STORE_NAME).delete(key); tx.oncomplete=function(){resolve(true);}; tx.onerror=function(){reject(tx.error);}; }); }); }

function loadIndex(){ return idbGet('index').then(function(v){ return v || []; }); }
function saveIndex(dates){ return idbSet('index', dates); }
function loadSnapshot(date){ return idbGet('snap:'+date); }
function saveSnapshotRaw(date, data){ return idbSet('snap:'+date, data); }
function deleteSnapshotRaw(date){ return idbDelete('snap:'+date); }
function loadConfigStore(){ return idbGet('config'); }
function saveConfigRaw(cfg){ return idbSet('config', cfg); }

function defaultLegs(){
  return [
    { id:'leg1', type:'put', strike:null, qty:1, premium:null },
    { id:'leg2', type:'put', strike:null, qty:1, premium:null },
    { id:'leg3', type:'call', strike:null, qty:1, premium:null }
  ];
}
var DEFAULT_CONFIG = { legs: defaultLegs(), entryDTEFront:30, entryDTEBack:60, exitDTEFront:7, exitProfitPct:null, exitStopPct:null, startDate:'', endDate:'', githubRepo:'', githubBranch:'main', cushion:5, entryWeekday:'', maxConcurrent:1, backtestMode:'single', entryTimeOfDay:'first' };
var legIdCounter = 4;

var state = { tab: 'data', snapshots: [], snapshotCache: {}, config: DEFAULT_CONFIG };

async function init(){
  var dates = await loadIndex();
  var cfg = await loadConfigStore();
  if (cfg) state.config = Object.assign({}, DEFAULT_CONFIG, cfg, { legs: (cfg.legs && cfg.legs.length) ? cfg.legs.map(function(l){ return Object.assign({premium:null}, l); }) : defaultLegs() });
  for (var i=0;i<dates.length;i++){
    var date = dates[i];
    var snap = await loadSnapshot(date);
    if (snap){
      state.snapshotCache[date] = snap;
      var exps = Array.from(new Set(snap.chain.map(function(c){return c.expiration;}))).sort();
      state.snapshots.push({date:date, spot:snap.spot, chainCount:snap.chain.length, expirations:exps});
    }
  }
  state.snapshots.sort(function(a,b){return new Date(a.date)-new Date(b.date);});
  render();
  autoSyncOnLoad();
}

async function saveOneSnapshot(parsed){
  if (!parsed || !parsed.date || parsed.spot == null || isNaN(parsed.spot) || !Array.isArray(parsed.chain) || !parsed.chain.length) return false;
  await saveSnapshotRaw(parsed.date, parsed);
  var dates = await loadIndex();
  if (dates.indexOf(parsed.date) === -1){ dates.push(parsed.date); await saveIndex(dates); }
  var exps = Array.from(new Set(parsed.chain.map(function(c){return c.expiration;}))).sort();
  state.snapshots = state.snapshots.filter(function(s){return s.date !== parsed.date;});
  state.snapshots.push({date:parsed.date, spot:parsed.spot, chainCount:parsed.chain.length, expirations:exps});
  state.snapshots.sort(function(a,b){return new Date(a.date)-new Date(b.date);});
  state.snapshotCache[parsed.date] = parsed;
  return true;
}

/* ---------- CSV parsing ---------- */
function splitCSVLine(line){
  var result=[], cur='', inQuotes=false;
  for (var i=0;i<line.length;i++){
    var ch = line[i];
    if (ch === '"'){ inQuotes = !inQuotes; continue; }
    if (ch === ',' && !inQuotes){ result.push(cur); cur=''; continue; }
    cur += ch;
  }
  result.push(cur);
  return result;
}
var ALIASES = {
  date: ['date','snapshot_date','quote_date','trade_date','datadate','snapshotdate'],
  spot: ['spot','underlying_price','underlyingprice','underlying','close','stock_price','stockprice','price'],
  expiration: ['expiration','exp','expiry','expiration_date','expdate'],
  type: ['type','option_type','optiontype','call_put','callput','cp','right'],
  strike: ['strike','strike_price','strikeprice'],
  bid: ['bid'],
  ask: ['ask'],
  last: ['last','lastprice','last_price'],
  iv: ['iv','impliedvolatility','implied_vol','implied_volatility'],
  volume: ['volume','vol'],
  openInterest: ['openinterest','open_interest','oi']
};
function normalizeDate(raw){
  if (!raw) return null;
  var d = new Date(raw);
  if (isNaN(d.getTime())) return raw.trim();
  return d.toISOString().slice(0,10);
}
function normalizeRow(obj){
  var out = {};
  Object.keys(ALIASES).forEach(function(key){
    var found = ALIASES[key].find(function(a){ return obj.hasOwnProperty(a) && obj[a] !== ''; });
    var raw = found ? obj[found] : undefined;
    if (key === 'date') out.date = raw ? normalizeDate(raw) : null;
    else if (key === 'expiration') out.expiration = raw ? normalizeDate(raw) : null;
    else if (key === 'type'){
      var t = (raw||'').toLowerCase().trim();
      out.type = (t==='c'||t==='call'||t==='calls') ? 'call' : (t==='p'||t==='put'||t==='puts') ? 'put' : t;
    } else {
      var num = raw !== undefined ? parseFloat(raw) : NaN;
      out[key] = isNaN(num) ? null : num;
    }
  });
  if (out.iv != null && out.iv > 1.5) out.iv = out.iv / 100;
  return out;
}
function parseCSV(text){
  var lines = text.split(/\r\n|\n/).filter(function(l){return l.trim().length;});
  if (!lines.length) return [];
  var headers = splitCSVLine(lines[0]).map(function(h){return h.trim().toLowerCase();});
  var rows = [];
  for (var i=1;i<lines.length;i++){
    var cells = splitCSVLine(lines[i]);
    var obj = {};
    headers.forEach(function(h,idx){ obj[h] = cells[idx] !== undefined ? cells[idx].trim() : ''; });
    rows.push(normalizeRow(obj));
  }
  return rows;
}
async function importCSV(text){
  var rows = parseCSV(text);
  var grouped = {};
  rows.forEach(function(row){
    if (!row.date || !row.expiration || !row.type || row.strike == null) return;
    if (!grouped[row.date]) grouped[row.date] = { date: row.date, spot: row.spot, chain: [] };
    if (grouped[row.date].spot == null && row.spot != null) grouped[row.date].spot = row.spot;
    grouped[row.date].chain.push({
      expiration: row.expiration, type: row.type, strike: row.strike,
      bid: row.bid||0, ask: row.ask||0, last: row.last||0, iv: row.iv||0,
      volume: row.volume||0, openInterest: row.openInterest||0
    });
  });
  var saved = 0, skipped = 0, dates = Object.keys(grouped);
  for (var i=0;i<dates.length;i++){
    var snap = grouped[dates[i]];
    if (snap.spot == null){ skipped++; continue; }
    if (await saveOneSnapshot(snap)) saved++; else skipped++;
  }
  return { saved: saved, skipped: skipped, total: dates.length };
}

function handleFileUpload(file){
  var msgEl = document.getElementById('fileMsg');
  var name = file.name.toLowerCase();

  if (name.endsWith('.zip')){
    if (typeof fflate === 'undefined'){
      msgEl.innerHTML = '<div class="msg-error">Zip support library did not load (no internet access?). Try a CSV or JSON file instead.</div>';
      return;
    }
    msgEl.innerHTML = '<div style="font-size:12.5px;color:#8B9099;">Reading zip file...</div>';
    var reader = new FileReader();
    reader.onload = async function(e){
      var buf = new Uint8Array(e.target.result);
      var entries;
      try { entries = fflate.unzipSync(buf); }
      catch(err){ msgEl.innerHTML = '<div class="msg-error">Could not read zip file: '+err.message+'</div>'; return; }

      var jsonNames = Object.keys(entries).filter(function(n){ return n.toLowerCase().endsWith('.json'); });
      if (!jsonNames.length){ msgEl.innerHTML = '<div class="msg-error">No .json files found inside that zip.</div>'; return; }

      var saved = 0, failed = 0;
      for (var i=0;i<jsonNames.length;i++){
        if (i % 100 === 0){
          msgEl.innerHTML = '<div style="font-size:12.5px;color:#8B9099;">Importing... '+i+' / '+jsonNames.length+'</div>';
          await new Promise(function(res){ setTimeout(res, 0); }); // let the UI repaint
        }
        try {
          var text = fflate.strFromU8(entries[jsonNames[i]]);
          var parsed = JSON.parse(text);
          if (await saveOneSnapshot(parsed)) saved++; else failed++;
        } catch(err){ failed++; }
      }
      render();
      document.getElementById('fileMsg').innerHTML = '<div class="msg-success">Imported '+saved+' snapshot(s) from zip'+(failed?(', '+failed+' failed'):'')+'.</div>';
    };
    reader.readAsArrayBuffer(file);
    return;
  }

  var reader = new FileReader();
  reader.onload = async function(e){
    var text = e.target.result;
    if (name.endsWith('.csv')){
      var result = await importCSV(text);
      render();
      var m = document.getElementById('fileMsg');
      if (result.saved > 0){
        m.innerHTML = '<div class="msg-success">Imported '+result.saved+' snapshot(s) from CSV'+(result.skipped?(', skipped '+result.skipped+' (missing spot price)'):'')+'.</div>';
      } else {
        m.innerHTML = '<div class="msg-error">Could not find usable rows. Make sure your CSV has columns for date, expiration, type (call/put), strike, and a spot/underlying price.</div>';
      }
    } else {
      var parsed;
      try { parsed = JSON.parse(text); } catch(err){
        msgEl.innerHTML = '<div class="msg-error">Not valid JSON.</div>'; return;
      }
      if (Array.isArray(parsed.snapshots)){
        if (parsed.config) { state.config = Object.assign({}, DEFAULT_CONFIG, parsed.config, {legs: (parsed.config.legs && parsed.config.legs.length) ? parsed.config.legs : defaultLegs()}); await saveConfigRaw(state.config); }
        var count = 0;
        for (var i=0;i<parsed.snapshots.length;i++){ if (await saveOneSnapshot(parsed.snapshots[i])) count++; }
        render();
        document.getElementById('fileMsg').innerHTML = '<div class="msg-success">Restored '+count+' snapshot(s) from backup.</div>';
      } else if (parsed.date && parsed.spot && Array.isArray(parsed.chain)){
        var ok = await saveOneSnapshot(parsed);
        render();
        document.getElementById('fileMsg').innerHTML = ok ? '<div class="msg-success">Saved snapshot for '+parsed.date+'.</div>' : '<div class="msg-error">Missing required fields.</div>';
      } else {
        msgEl.innerHTML = '<div class="msg-error">Unrecognized JSON format.</div>';
      }
    }
  };
  reader.readAsText(file);
}

function exportBackup(){
  var backup = { config: state.config, snapshots: state.snapshots.map(function(s){ return state.snapshotCache[s.date]; }) };
  var blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'tcl-backup-'+(new Date().toISOString().slice(0,10))+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function syncFromGithubCore(){
  var repo = (state.config.githubRepo || '').trim();
  var branch = (state.config.githubBranch || 'main').trim() || 'main';
  if (!repo) return { error: 'No repo configured.' };
  var base = 'https://raw.githubusercontent.com/'+repo+'/'+branch+'/snapshots/';
  try {
    var idxResp = await fetch(base+'index.json?_='+Date.now());
    if (!idxResp.ok) return { error: 'Could not find snapshots/index.json in that repo/branch (status '+idxResp.status+'). Check the repo name and that the Action has run at least once.' };
    var dates = await idxResp.json();
    if (!Array.isArray(dates)) return { error: 'index.json was not a list of dates.' };
    var have = new Set(state.snapshots.map(function(s){return s.date.replace(/:/g,'-');}));
    var toFetch = dates.filter(function(d){ return !have.has(d); });
    var fetched = 0;
    for (var i=0;i<toFetch.length;i++){
      var d = toFetch[i];
      var r = await fetch(base+'qqq_'+d+'.json?_='+Date.now());
      if (!r.ok) continue;
      var snap = await r.json();
      if (await saveOneSnapshot(snap)) fetched++;
    }
    return { fetched: fetched, total: dates.length };
  } catch(err){
    return { error: String(err.message || err) };
  }
}

async function syncFromGithub(){
  var statusEl = document.getElementById('githubMsg');
  var repo = (state.config.githubRepo || '').trim();
  if (!repo){ if(statusEl) statusEl.innerHTML = '<div class="msg-error">Enter your repo first, e.g. yourusername/qqq-snapshots.</div>'; return; }
  if (statusEl) statusEl.innerHTML = '<div style="font-size:12.5px;color:#8B9099;">Syncing...</div>';
  var result = await syncFromGithubCore();
  render();
  var statusEl2 = document.getElementById('githubMsg');
  if (!statusEl2) return;
  if (result.error) statusEl2.innerHTML = '<div class="msg-error">'+result.error+'</div>';
  else statusEl2.innerHTML = '<div class="msg-success">Synced. '+result.fetched+' snapshot(s) added/updated from '+repo+' ('+result.total+' available total).</div>';
}

async function autoSyncOnLoad(){
  if (!state.config.githubRepo) return;
  var result = await syncFromGithubCore();
  if (!result.error && result.fetched > 0) render();
}

  var computeStrikesBtn = document.getElementById('computeStrikesBtn');
  if (computeStrikesBtn) computeStrikesBtn.addEventListener('click', function(){

  /* strategy: legs */
  document.querySelectorAll('.leg-type').forEach(function(sel){

  document.querySelectorAll('.leg-strike').forEach(function(inp){

  document.querySelectorAll('.leg-qty').forEach(function(inp){

      saveConfigRaw(state.config);
    });
  });
  document.querySelectorAll('.leg-premium').forEach(function(inp){
    inp.addEventListener('change', function(){
      var idx = parseInt(inp.getAttribute('data-idx'),10);
      var v = inp.value.trim();
      state.config.legs[idx].premium = v === '' ? null : parseFloat(v);
      saveConfigRaw(state.config);
    });
  });
  document.querySelectorAll('.leg-remove').forEach(function(btn){
    btn.addEventListener('click', function(){
      var idx = parseInt(btn.getAttribute('data-idx'),10);
      state.config.legs.splice(idx,1);
      saveConfigRaw(state.config);
      render();
    });
  });
  var addPutBtn = document.getElementById('addPutBtn');
  if (addPutBtn) addPutBtn.addEventListener('click', function(){
    state.config.legs.push({ id:'leg'+(legIdCounter++), type:'put', strike:null, qty:1 });
    saveConfigRaw(state.config);
    render();
  });
  var addCallBtn = document.getElementById('addCallBtn');
  if (addCallBtn) addCallBtn.addEventListener('click', function(){
    state.config.legs.push({ id:'leg'+(legIdCounter++), type:'call', strike:null, qty:1 });
    saveConfigRaw(state.config);
    render();
  });
  var autofillBtn = document.getElementById('autofillBtn');
  if (autofillBtn) autofillBtn.addEventListener('click', function(){

    var spot = Math.round(state.snapshots[state.snapshots.length-1].spot);
    state.config.legs.forEach(function(leg){ if (!leg.strike) leg.strike = spot; });
    saveConfigRaw(state.config);
    render();

}

  try { parsed = JSON.parse(text); }

  box.value = '';

async function handleDelete(date){

/* ---------- BACKTEST TAB ---------- */
function runBacktest(){
  var config = state.config;
  if (!config.legs || !config.legs.length) return { error: 'Add at least one leg on the Strategy tab.' };
  var missingStrike = config.legs.some(function(l){ return !l.strike || l.strike <= 0; });
  if (missingStrike) return { error: 'Every leg needs a strike (starting price). Set them on the Strategy tab, or use "Fill blank strikes from latest spot".' };

  var snapshots = state.snapshots.slice();
  if (config.startDate) snapshots = snapshots.filter(function(s){ return s.date.slice(0,10) >= config.startDate; });
  if (config.endDate) snapshots = snapshots.filter(function(s){ return s.date.slice(0,10) <= config.endDate; });
  if (config.entryWeekday !== '' && config.entryWeekday != null){
    var wd = parseInt(config.entryWeekday,10);
    var entryIdx = snapshots.findIndex(function(s){ return weekdayOf(s.date) === wd; });
    if (entryIdx === -1) return { error: 'No snapshot in your date range falls on '+WEEKDAY_NAMES[wd]+'. Adjust the date range or pick a different entry weekday.' };
    snapshots = snapshots.slice(entryIdx);
  }
  var cache = state.snapshotCache;
  if (snapshots.length < 2) return { error: 'Not enough snapshots in the selected date range (need at least 2). You have '+snapshots.length+' in range -- adjust the start/end dates on the Strategy tab or collect more data.' };

  function findQuote(chain, strike, expiration, type){
    for (var i=0;i<chain.length;i++){ var c=chain[i]; if (Math.abs(c.strike-strike)<0.01 && c.expiration===expiration && c.type===type) return c; }
    return null;
  }
  function midOf(q){ if(!q) return null; if(q.bid>0 && q.ask>0) return (q.bid+q.ask)/2; if(q.last>0) return q.last; return null; }
  function pickExpiration(expirations, refDate, targetDTE){
    var best=null, bestDiff=Infinity;
    expirations.forEach(function(e){
      var dte = daysBetween(refDate, e);
      if (dte < 0) return;
      var diff = Math.abs(dte - targetDTE);
      if (diff < bestDiff){ bestDiff = diff; best = e; }
    });
    return best;
  }

  var entrySnap = cache[snapshots[0].date];
  var frontExp = pickExpiration(snapshots[0].expirations, entrySnap.date, config.entryDTEFront);
  var backExp = pickExpiration(snapshots[0].expirations, entrySnap.date, config.entryDTEBack);
  if (!frontExp || !backExp) return { error: 'Not enough expirations in the earliest snapshot of your selected range to build front/back legs.' };
  if (frontExp === backExp) return { error: 'Front and back legs both resolved to '+frontExp+' — your snapshot doesn\'t have an expiration far enough out to reach your back-leg target DTE ('+config.entryDTEBack+'d). This makes the calendar collapse to zero value at every point (which is why P&L looked frozen at -entry debit). Fix: re-run collect_qqq_snapshot.py with a higher MAX_EXPIRATIONS so it reaches further out, or lower "Back leg target DTE" to something your current snapshot actually has.' };

  var entryDebit = 0;
  var legDetail = config.legs.map(function(leg, idx){
    var shortQ = findQuote(entrySnap.chain, leg.strike, frontExp, leg.type);
    var longQ = findQuote(entrySnap.chain, leg.strike, backExp, leg.type);
    var shortMid = midOf(shortQ), longMid = midOf(longQ);
    var usingManualPremium = (leg.premium != null && !isNaN(leg.premium));
    var cost = usingManualPremium ? leg.premium : ((longMid==null?0:longMid) - (shortMid==null?0:shortMid));
    entryDebit += cost * leg.qty;
    var sameTypeBefore = config.legs.slice(0, idx+1).filter(function(l){return l.type===leg.type;}).length;
    var label = (leg.type==='put'?'Put ':'Call ')+sameTypeBefore;
    return Object.assign({}, leg, {label:label, shortMid:shortMid, longMid:longMid, cost:cost, usingManualPremium:usingManualPremium, shortIv: shortQ?shortQ.iv:undefined, longIv: longQ?longQ.iv:undefined});
  });

  var curve = snapshots.map(function(meta){
    var snap = cache[meta.date];
    var value = 0, reconstructed = false;
    legDetail.forEach(function(leg){
      var shortQ = findQuote(snap.chain, leg.strike, frontExp, leg.type);
      var longQ = findQuote(snap.chain, leg.strike, backExp, leg.type);
      var shortMid = midOf(shortQ), longMid = midOf(longQ);
      var tFront = daysBetween(snap.date, frontExp)/365;
      var tBack = daysBetween(snap.date, backExp)/365;
      if (shortMid == null){
        reconstructed = true;
        shortMid = tFront > 0 ? bsPrice(snap.spot, leg.strike, tFront, leg.shortIv||0.18, leg.type) : Math.max(0, leg.type==='call' ? snap.spot-leg.strike : leg.strike-snap.spot);
      }
      if (longMid == null){
        reconstructed = true;
        longMid = tBack > 0 ? bsPrice(snap.spot, leg.strike, tBack, leg.longIv||0.18, leg.type) : Math.max(0, leg.type==='call' ? snap.spot-leg.strike : leg.strike-snap.spot);
      }
      value += (longMid - shortMid) * leg.qty;
    });
    var pnl = (value - entryDebit) * 100;
    return {date: meta.date, spot: snap.spot, value: value, pnl: pnl, reconstructed: reconstructed};
  });

  var frontDTEAtLast = daysBetween(snapshots[snapshots.length-1].date, frontExp);
  var finalPnl = curve[curve.length-1].pnl;
  var maxPnl = Math.max.apply(null, curve.map(function(c){return c.pnl;}));
  var minPnl = Math.min.apply(null, curve.map(function(c){return c.pnl;}));

  var entryDebitDollars = Math.abs(entryDebit * 100);
  var profitTarget = (config.exitProfitPct != null && !isNaN(config.exitProfitPct)) ? entryDebitDollars * (config.exitProfitPct/100) : null;
  var stopLoss = (config.exitStopPct != null && !isNaN(config.exitStopPct)) ? entryDebitDollars * (config.exitStopPct/100) : null;
  var exitPoint = null;
  for (var i=0;i<curve.length;i++){
    var pt = curve[i];
    var dte = daysBetween(pt.date, frontExp);
    if (dte <= config.exitDTEFront){ exitPoint = {date:pt.date, pnl:pt.pnl, reason:'front DTE reached ('+Math.round(dte)+'d)'}; break; }
    if (profitTarget != null && pt.pnl >= profitTarget){ exitPoint = {date:pt.date, pnl:pt.pnl, reason:'profit target hit ('+config.exitProfitPct+'% of entry debit)'}; break; }
    if (stopLoss != null && pt.pnl <= -stopLoss){ exitPoint = {date:pt.date, pnl:pt.pnl, reason:'stop loss hit ('+config.exitStopPct+'% of entry debit)'}; break; }
  }

  return { frontExp:frontExp, backExp:backExp, legDetail:legDetail, entryDebit:entryDebit,
    curve:curve, finalPnl:finalPnl, maxPnl:maxPnl, minPnl:minPnl, frontDTEAtLast:frontDTEAtLast, entryDate:snapshots[0].date,
    exitPoint:exitPoint };
}

/* ---------- ROLLING (MULTI-CYCLE) BACKTEST ---------- */
function markPositionValue(legs, snap, frontExp, backExp){
  var value = 0, reconstructed = false;
  legs.forEach(function(leg){
    var shortQ = findQuoteInChain(snap.chain, leg.strike, frontExp, leg.type);
    var longQ = findQuoteInChain(snap.chain, leg.strike, backExp, leg.type);
    var shortMid = midOfQuote(shortQ), longMid = midOfQuote(longQ);
    var tFront = daysBetween(snap.date, frontExp)/365;
    var tBack = daysBetween(snap.date, backExp)/365;
    if (shortMid == null){
      reconstructed = true;
      shortMid = tFront > 0 ? bsPrice(snap.spot, leg.strike, tFront, leg.iv||0.18, leg.type) : Math.max(0, leg.type==='call' ? snap.spot-leg.strike : leg.strike-snap.spot);
    }
    if (longMid == null){
      reconstructed = true;
      longMid = tBack > 0 ? bsPrice(snap.spot, leg.strike, tBack, leg.iv||0.18, leg.type) : Math.max(0, leg.type==='call' ? snap.spot-leg.strike : leg.strike-snap.spot);
    }
    value += (longMid - shortMid) * leg.qty;
  });
  return { value: value, reconstructed: reconstructed };
}

function computeLegsForEntry(meta, snap, config){
  var frontExp = pickExpirationFor(meta.expirations, snap.date, config.entryDTEFront);
  var backExp = pickExpirationFor(meta.expirations, snap.date, config.entryDTEBack);
  if (!frontExp || !backExp || frontExp === backExp) return null;

  var strikesAvail = Array.from(new Set(snap.chain.filter(function(c){return c.expiration===frontExp;}).map(function(c){return c.strike;})));
  if (!strikesAvail.length) return null;
  var grid = detectLocalStrikeGrid(strikesAvail, snap.spot);
  var atmStrike = pickATMStrikeDownside(strikesAvail, snap.spot, grid);

  var atmCallQ = findQuoteInChain(snap.chain, atmStrike, frontExp, 'call');
  var atmPutQ = findQuoteInChain(snap.chain, atmStrike, frontExp, 'put');
  var atmCallMid = midOfQuote(atmCallQ), atmPutMid = midOfQuote(atmPutQ);
  if (atmCallMid == null || atmPutMid == null) return null;

  var straddle = atmCallMid + atmPutMid;
  var cushion = (config.cushion != null && !isNaN(config.cushion)) ? config.cushion : 5;
  var offset = roundUpToGrid(straddle + cushion, grid);

  function nearestAvailable(target){
    var best = strikesAvail[0], bestDiff = Math.abs(strikesAvail[0]-target);
    strikesAvail.forEach(function(s){ var d = Math.abs(s-target); if (d < bestDiff){ bestDiff = d; best = s; } });
    return best;
  }
  var callStrike = nearestAvailable(atmStrike+offset);
  var putStrike = nearestAvailable(atmStrike-offset);

  var qtyPut1 = (config.legs[0] && config.legs[0].qty) || 1;
  var qtyCall = (config.legs[1] && config.legs[1].qty) || 1;
  var qtyPut2 = (config.legs[2] && config.legs[2].qty) || 1;
  var legs = [
    { type:'put', strike:atmStrike, qty:qtyPut1 },
    { type:'call', strike:callStrike, qty:qtyCall },
    { type:'put', strike:putStrike, qty:qtyPut2 }
  ];

  var entryDebit = 0;
  legs.forEach(function(leg){
    var shortQ = findQuoteInChain(snap.chain, leg.strike, frontExp, leg.type);
    var longQ = findQuoteInChain(snap.chain, leg.strike, backExp, leg.type);
    var shortMid = midOfQuote(shortQ), longMid = midOfQuote(longQ);
    leg.iv = shortQ ? shortQ.iv : (longQ ? longQ.iv : 0.18);
    var cost = (longMid==null?0:longMid) - (shortMid==null?0:shortMid);
    entryDebit += cost * leg.qty;
  });

  return { frontExp:frontExp, backExp:backExp, legs:legs, entryDebit:entryDebit, atmStrike:atmStrike, straddle:straddle, cushion:cushion, offset:offset };
}

function runRollingBacktest(){
  var config = state.config;
  var snapshots = state.snapshots.slice();
  if (config.startDate) snapshots = snapshots.filter(function(s){ return s.date.slice(0,10) >= config.startDate; });
  if (config.endDate) snapshots = snapshots.filter(function(s){ return s.date.slice(0,10) <= config.endDate; });
  if (snapshots.length < 2) return { error: 'Not enough snapshots in the selected date range (need at least 2). You have '+snapshots.length+' in range.' };

  var maxConcurrent = Math.max(1, parseInt(config.maxConcurrent,10) || 1);
  var wdFilter = (config.entryWeekday !== '' && config.entryWeekday != null) ? parseInt(config.entryWeekday,10) : null;
  var cache = state.snapshotCache;

  // Precompute which snapshot index is each calendar day's entry reference (start or end of day)
  var dayEntryIndex = {};
  for (var di=0; di<snapshots.length; di++){
    var d = snapshots[di].date.slice(0,10);
    if (config.entryTimeOfDay === 'last'){
      dayEntryIndex[d] = di; // keeps getting overwritten -> ends up as the LAST index seen for that day
    } else if (!(d in dayEntryIndex)){
      dayEntryIndex[d] = di; // only set on first occurrence -> the FIRST index for that day
    }
  }

  var openPositions = [];
  var closedTrades = [];
  var equityCurve = [];
  var usedEntryDates = {};
  var peakConcurrent = 0;
  var failedEntryAttempts = 0;

  for (var i=0;i<snapshots.length;i++){
    var meta = snapshots[i];
    var snap = cache[meta.date];

    var stillOpen = [];
    var unrealizedSum = 0;
    openPositions.forEach(function(pos){
      var mv = markPositionValue(pos.legs, snap, pos.frontExp, pos.backExp);
      var pnl = (mv.value - pos.entryDebit) * 100;
      var dte = daysBetween(meta.date, pos.frontExp);
      var entryDebitDollars = Math.abs(pos.entryDebit * 100);
      var pt = (config.exitProfitPct != null && !isNaN(config.exitProfitPct)) ? entryDebitDollars * (config.exitProfitPct/100) : null;
      var sl = (config.exitStopPct != null && !isNaN(config.exitStopPct)) ? entryDebitDollars * (config.exitStopPct/100) : null;
      var reason = null;
      if (dte <= config.exitDTEFront) reason = 'front DTE reached';
      else if (pt != null && pnl >= pt) reason = 'profit target hit';
      else if (sl != null && pnl <= -sl) reason = 'stop loss hit';
      if (reason){
        closedTrades.push({ entryDate:pos.entryDate, exitDate:meta.date, frontExp:pos.frontExp, backExp:pos.backExp, legs:pos.legs, entryDebit:pos.entryDebit, exitPnl:pnl, reason:reason });
      } else {
        pos.lastPnl = pnl;
        unrealizedSum += pnl;
        stillOpen.push(pos);
      }
    });
    openPositions = stillOpen;

    var isEntryDay = (wdFilter == null) ? true : (weekdayOf(meta.date) === wdFilter);
    var calDay = meta.date.slice(0,10);
    var isDayEntryReference = (dayEntryIndex[calDay] === i);
    if (isEntryDay && isDayEntryReference && openPositions.length < maxConcurrent && !usedEntryDates[calDay]){
      var built = computeLegsForEntry(meta, snap, config);
      if (built){
        openPositions.push({ entryDate:meta.date, frontExp:built.frontExp, backExp:built.backExp, legs:built.legs, entryDebit:built.entryDebit, lastPnl:0 });
        usedEntryDates[calDay] = true;
      } else {
        failedEntryAttempts++;
      }
    }
    peakConcurrent = Math.max(peakConcurrent, openPositions.length);
    var realizedSum = closedTrades.reduce(function(s,t){ return s+t.exitPnl; }, 0);
    equityCurve.push({ date: meta.date, pnl: realizedSum + unrealizedSum, openCount: openPositions.length });
  }

  return { closedTrades:closedTrades, openPositions:openPositions, equityCurve:equityCurve,
    peakConcurrent:peakConcurrent, failedEntryAttempts:failedEntryAttempts, totalSnapshots:snapshots.length };
}

function svgLineChart(curve){
  var w=880, h=220, padL=50, padR=12, padT=12, padB=26;
  var vals = curve.map(function(c){return c.pnl;});
  var minV = Math.min(0, Math.min.apply(null, vals));
  var maxV = Math.max(0, Math.max.apply(null, vals));
  if (minV === maxV){ minV -= 1; maxV += 1; }
  var xStep = (w - padL - padR) / Math.max(1, curve.length - 1);
  function xAt(i){ return padL + i*xStep; }
  function yAt(v){ return padT + (1 - (v - minV)/(maxV - minV)) * (h - padT - padB); }
  var pts = curve.map(function(c,i){ return xAt(i)+','+yAt(c.pnl); }).join(' ');
  var zeroY = yAt(0);
  var dots = curve.map(function(c,i){ return '<circle cx="'+xAt(i)+'" cy="'+yAt(c.pnl)+'" r="3" fill="#C9A227"/>'; }).join('');
  var xLabels = curve.map(function(c,i){
    if (curve.length > 8 && i % Math.ceil(curve.length/8) !== 0 && i !== curve.length-1) return '';
    return '<text x="'+xAt(i)+'" y="'+(h-8)+'" font-size="10" fill="#8B9099" text-anchor="middle" font-family=\'IBM Plex Mono\'>'+formatDateLabel(c.date)+'</text>';
  }).join('');
  var yTicks = [minV, (minV+maxV)/2, maxV].map(function(v){
    return '<text x="'+(padL-8)+'" y="'+(yAt(v)+3)+'" font-size="10" fill="#8B9099" text-anchor="end" font-family=\'IBM Plex Mono\'>$'+Math.round(v)+'</text>'+
      '<line x1="'+padL+'" y1="'+yAt(v)+'" x2="'+(w-padR)+'" y2="'+yAt(v)+'" stroke="#2A2F35" stroke-width="1"/>';
  }).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:100%;">'+
    yTicks+
    '<line x1="'+padL+'" y1="'+zeroY+'" x2="'+(w-padR)+'" y2="'+zeroY+'" stroke="#4A4F55" stroke-width="1"/>'+
    '<polyline points="'+pts+'" fill="none" stroke="#C9A227" stroke-width="2"/>'+
    dots+xLabels+
  '</svg>';
}

function renderBacktest(){
  var mode = state.config.backtestMode || 'single';
  var toggle = '<div style="display:flex;gap:8px;margin-bottom:20px;">'+
    '<button class="ghost small backtest-mode-btn" data-mode="single" style="'+(mode==='single'?'border-color:#C9A227;color:#E9E6DE;':'')+'">Single trade</button>'+
    '<button class="ghost small backtest-mode-btn" data-mode="rolling" style="'+(mode==='rolling'?'border-color:#C9A227;color:#E9E6DE;':'')+'">Rolling (multi-cycle)</button>'+
  '</div>';
  if (state.snapshots.length < 2){
    return toggle+'<div class="eyebrow">STEP 3</div><div class="h1 display">Backtest results</div>'+
      '<div class="card empty">Need at least 2 snapshots to mark a position to market over time. You have '+state.snapshots.length+'. Go collect more.</div>';
  }
  return toggle + (mode === 'rolling' ? renderRollingBacktest() : renderSingleBacktest());
}

function renderSingleBacktest(){
  var bt = runBacktest();
  if (bt.error){
    return '<div class="eyebrow">STEP 3</div><div class="h1 display">Backtest results</div>'+
      '<div class="card" style="padding:24px;color:#D08E8E;font-size:13.5px;">'+bt.error+'</div>';
  }
  var pnlColor = bt.finalPnl >= 0 ? '#C9A227' : '#B85C56';
  var anyRecon = bt.curve.some(function(c){return c.reconstructed;});
  var stats = [
    ['ENTRY DEBIT', fmtMoney(bt.entryDebit*100), '#E9E6DE'],
    ['CURRENT P&L', fmtMoney(bt.finalPnl), pnlColor],
    ['MAX P&L', fmtMoney(bt.maxPnl), '#9FBF8F'],
    ['MAX DRAWDOWN', fmtMoney(bt.minPnl), '#D08E8E'],
    ['FRONT DTE NOW', Math.max(0,Math.round(bt.frontDTEAtLast))+'d', '#E9E6DE']
  ].map(function(s){ return '<div class="card stat"><div class="stat-label mono">'+s[0]+'</div><div class="stat-value mono" style="color:'+s[2]+'">'+s[1]+'</div></div>'; }).join('');
  var exitBox = bt.exitPoint
    ? '<div class="card" style="padding:16px 18px;margin-bottom:18px;border-color:#4C7A8A;"><div class="stat-label mono" style="margin-bottom:6px;">EXIT SIGNAL TRIGGERED</div><div style="font-size:13.5px;">'+bt.exitPoint.date+' &mdash; '+bt.exitPoint.reason+' &mdash; P&amp;L at exit: <span class="mono" style="color:'+(bt.exitPoint.pnl>=0?'#C9A227':'#B85C56')+';font-weight:600;">'+fmtMoney(bt.exitPoint.pnl)+'</span></div></div>'
    : '<div class="card" style="padding:16px 18px;margin-bottom:18px;"><div class="stat-label mono" style="margin-bottom:6px;">EXIT SIGNAL</div><div style="font-size:13.5px;color:#8B9099;">Not triggered within your stored snapshots &mdash; position is still open as far as your data shows.</div></div>';
  var legRows = bt.legDetail.map(function(leg){
    var midText = leg.usingManualPremium
      ? 'manual premium used (snapshot mid: '+(leg.shortMid!=null?'$'+leg.shortMid.toFixed(2):'n/a')+' short / '+(leg.longMid!=null?'$'+leg.longMid.toFixed(2):'n/a')+' long)'
      : 'short '+(leg.shortMid!=null?'$'+leg.shortMid.toFixed(2):'n/a')+' &middot; long '+(leg.longMid!=null?'$'+leg.longMid.toFixed(2):'n/a');
    return '<div class="leg-detail-row">'+
      '<div style="width:90px;font-weight:500;">'+leg.label+'</div>'+
      '<div class="mono" style="width:80px;color:#8B9099;">K '+leg.strike+' &times;'+leg.qty+'</div>'+
      '<div class="mono" style="flex:1;color:#8B9099;">'+midText+'</div>'+
      '<div class="mono" style="width:80px;text-align:right;color:'+(leg.cost>=0?'#D08E8E':'#9FBF8F')+';">'+fmtMoney(leg.cost)+'</div>'+
    '</div>';
  }).join('');
  var rangeNote = (state.config.startDate || state.config.endDate)
    ? ' &middot; range '+(state.config.startDate||'earliest')+' to '+(state.config.endDate||'latest')
    : '';
  return ''+
  '<div class="eyebrow">STEP 3</div>'+
  '<div class="h1 display">Backtest results</div>'+
  '<div class="desc">Position opened '+bt.entryDate+' &middot; short '+bt.frontExp+' / long '+bt.backExp+' &middot; marked to market across '+bt.curve.length+' snapshots'+rangeNote+'.</div>'+
  '<div class="stat-row">'+stats+'</div>'+
  exitBox+
  '<div class="card" style="padding:18px;margin-bottom:18px;height:260px;">'+svgLineChart(bt.curve)+'</div>'+
  '<div class="section-label mono">LEG BREAKDOWN AT ENTRY</div>'+
  '<div class="card" style="margin-bottom:12px;">'+legRows+'</div>'+
  (anyRecon ? '<div style="font-size:11.5px;color:#8B9099;">Note: some points use a Black-Scholes estimate because the exact contract was not quoted in that day\'s chain (thin OTM strikes often show 0 bid/ask).</div>' : '');
}

function renderRollingBacktest(){
  var rt = runRollingBacktest();
  if (rt.error){
    return '<div class="eyebrow">STEP 3</div><div class="h1 display">Backtest results (rolling)</div>'+
      '<div class="card" style="padding:24px;color:#D08E8E;font-size:13.5px;">'+rt.error+'</div>';
  }
  var closed = rt.closedTrades;
  var wins = closed.filter(function(t){return t.exitPnl>0;}).length;
  var winRate = closed.length ? (wins/closed.length*100) : 0;
  var realizedTotal = closed.reduce(function(s,t){return s+t.exitPnl;},0);
  var avgPnl = closed.length ? realizedTotal/closed.length : 0;
  var openUnrealized = rt.openPositions.reduce(function(s,p){return s+(p.lastPnl||0);},0);
  var finalTotal = realizedTotal + openUnrealized;
  var pnlColor = finalTotal >= 0 ? '#C9A227' : '#B85C56';

  var stats = [
    ['TRADES CLOSED', String(closed.length), '#E9E6DE'],
    ['WIN RATE', closed.length ? winRate.toFixed(0)+'%' : 'n/a', '#9FBF8F'],
    ['TOTAL P&L', fmtMoney(finalTotal), pnlColor],
    ['AVG P&L / TRADE', closed.length ? fmtMoney(avgPnl) : 'n/a', '#E9E6DE'],
    ['PEAK CONCURRENT', String(rt.peakConcurrent), '#E9E6DE'],
    ['OPEN NOW', String(rt.openPositions.length), '#4C7A8A']
  ].map(function(s){ return '<div class="card stat"><div class="stat-label mono">'+s[0]+'</div><div class="stat-value mono" style="color:'+s[2]+'">'+s[1]+'</div></div>'; }).join('');

  var openRows = rt.openPositions.map(function(p){
    var legsText = p.legs.map(function(l){ return (l.type==='put'?'P':'C')+l.strike; }).join(' / ');
    return '<div class="leg-detail-row">'+
      '<div style="width:110px;font-weight:500;">'+p.entryDate+'</div>'+
      '<div class="mono" style="flex:1;color:#8B9099;">'+legsText+' &middot; short '+p.frontExp+' / long '+p.backExp+'</div>'+
      '<div class="mono" style="width:80px;text-align:right;color:'+((p.lastPnl||0)>=0?'#C9A227':'#B85C56')+';">'+fmtMoney(p.lastPnl||0)+'</div>'+
    '</div>';
  }).join('');

  var closedRows = closed.slice().reverse().map(function(t){
    var legsText = t.legs.map(function(l){ return (l.type==='put'?'P':'C')+l.strike; }).join(' / ');
    return '<div class="leg-detail-row">'+
      '<div style="width:190px;font-size:11.5px;color:#8B9099;">'+t.entryDate+' &rarr; '+t.exitDate+'</div>'+
      '<div class="mono" style="flex:1;color:#8B9099;font-size:11.5px;">'+legsText+' &middot; '+t.reason+'</div>'+
      '<div class="mono" style="width:80px;text-align:right;color:'+(t.exitPnl>=0?'#C9A227':'#B85C56')+';">'+fmtMoney(t.exitPnl)+'</div>'+
    '</div>';
  }).join('');

  var rangeNote = (state.config.startDate || state.config.endDate)
    ? ' &middot; range '+(state.config.startDate||'earliest')+' to '+(state.config.endDate||'latest')
    : '';
  var wdNote = (state.config.entryWeekday !== '' && state.config.entryWeekday != null) ? ' &middot; entries on '+WEEKDAY_NAMES[parseInt(state.config.entryWeekday,10)]+' only' : '';

  return ''+
  '<div class="eyebrow">STEP 3</div>'+
  '<div class="h1 display">Backtest results (rolling)</div>'+
  '<div class="desc">Up to '+ (Math.max(1,parseInt(state.config.maxConcurrent,10)||1)) +' position(s) open at once, strikes recomputed from that day\'s ATM straddle + cushion at every new entry, across '+rt.totalSnapshots+' snapshots'+rangeNote+wdNote+'.</div>'+
  '<div class="stat-row">'+stats+'</div>'+
  '<div class="card" style="padding:18px;margin-bottom:18px;height:260px;">'+svgLineChart(rt.equityCurve)+'</div>'+
  (rt.openPositions.length ? '<div class="section-label mono">CURRENTLY OPEN ('+rt.openPositions.length+')</div><div class="card" style="margin-bottom:18px;">'+openRows+'</div>' : '')+
  '<div class="section-label mono">CLOSED TRADES ('+closed.length+')</div>'+
  '<div class="card" style="margin-bottom:12px;">'+(closedRows || '<div class="empty">No trades closed yet within this range.</div>')+'</div>'+
  (rt.failedEntryAttempts ? '<div style="font-size:11.5px;color:#8B9099;">Note: '+rt.failedEntryAttempts+' potential entry day(s) were skipped because ATM call/put quotes weren\'t available that day.</div>' : '');
}

init();
</script>
